name: Excel'den oyun içeriği üret
on:
  push:
    paths: ["Makarya_Icerik.xlsx"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - name: Excel'i doğrula ve content.js üret
        run: python3 tools/icerik.py xlsx2js
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet content.js; then echo "content.js değişmedi"; exit 0; fi
          git config user.name "makarya-bot"
          git config user.email "makarya-bot@users.noreply.github.com"
          git add content.js
          git commit -m "İçerik Excel'den güncellendi"
          git push
      - name: Sayfayı yeniden yayınla
        continue-on-error: true
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
